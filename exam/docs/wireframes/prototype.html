<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maaltijdboxen – Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;font-size:14px;color:#212121;background:#e9e9e9;padding:72px 0 40px}
button,input,textarea{font:inherit;color:inherit}
.toolbar{position:fixed;top:0;left:0;right:0;z-index:10;background:#212121;color:#fff;display:flex;align-items:center;gap:16px;padding:12px 24px;font-size:13px;flex-wrap:wrap}
.toolbar strong{margin-right:8px}
.toolbar a{color:#b3b3b3;text-decoration:none;cursor:pointer}
.toolbar a.on{color:#fff;font-weight:600;text-decoration:underline}
.frame{width:1280px;margin:0 auto}
.frame.mobile-frame{width:390px}
.screen{background:#f5f5f5;min-height:800px;position:relative}
.mobile-frame .screen{min-height:844px}
.header{display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid #e3e3e3;padding:16px 32px}
.mobile-frame .header{padding:14px 16px}
.header .left{display:flex;align-items:center;gap:32px}
.logo{font-weight:700;font-size:18px}
.nav{display:flex;gap:24px}
.nav a{color:#8c8c8c;text-decoration:none;cursor:pointer}
.nav a.active{color:#212121;font-weight:600}
.header .right{display:flex;align-items:center;gap:12px}
.content{padding:32px;display:flex;flex-direction:column;gap:24px}
.mobile-frame .content{padding:16px;gap:16px}
h1{font-size:24px;font-weight:700}
h2{font-size:16px;font-weight:600}
.muted{color:#8c8c8c;font-size:12px}
.sub{color:#595959;font-size:13px}
.row{display:flex;gap:24px;align-items:flex-start}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:#fff;border:1px solid #e3e3e3;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:6px;border:1px solid #ccc;background:#fff;font-weight:500;font-size:14px;color:#212121;white-space:nowrap;cursor:pointer}
.btn:hover{border-color:#8c8c8c}
.btn.primary{background:#212121;border-color:#212121;color:#fff}
.btn.small{padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{color:#b3b3b3;border-color:#e3e3e3;background:#fafafa;cursor:not-allowed}
.btn.primary:disabled{background:#ccc;border-color:#ccc;color:#fff}
.badge{display:inline-block;padding:4px 10px;border-radius:12px;background:#e3e3e3;color:#595959;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.badge.dark{background:#212121;color:#fff}
.badge.outline{background:#fff;border-color:#ccc}
.chip{cursor:pointer}
.chip.on{background:#212121;color:#fff;border-color:#212121}
.field{display:flex;flex-direction:column;gap:6px;flex:1}
.field label{font-size:12px;font-weight:500;color:#595959}
.input{border:1px solid #ccc;border-radius:6px;background:#fff;padding:10px 12px;min-height:40px;width:100%;outline:none}
.input:focus{border-color:#212121}
textarea.input{min-height:80px;resize:vertical}
.alert{border:1px solid #212121;border-left-width:4px;border-radius:6px;background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.alert.soft{border-color:#ccc;border-left-color:#595959}
.divider{height:1px;background:#e3e3e3}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e3e3e3}
th{text-align:left;font-size:12px;font-weight:600;color:#595959;background:#fafafa;padding:12px 16px;border-bottom:1px solid #e3e3e3}
td{padding:14px 16px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.selected td{background:#f5f5f5}
.stepper{display:flex;align-items:center;border:1px solid #ccc;border-radius:6px;width:max-content;background:#fff}
.stepper button{border:none;background:none;padding:8px 14px;cursor:pointer}
.stepper .val{border-left:1px solid #ccc;border-right:1px solid #ccc;font-weight:600;min-width:48px;text-align:center;padding:8px 0}
.tabs{display:flex;gap:8px}
.tab{padding:8px 14px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer}
.tab.active{border:2px solid #212121;font-weight:600;padding:7px 13px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot{border:1px solid #ccc;border-radius:8px;background:#fff;padding:14px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.slot.active{border:2px solid #212121;padding:13px}
.slot.full{background:#fafafa;color:#b3b3b3;border-style:dashed;cursor:not-allowed}
.check{display:inline-flex;align-items:center;gap:6px;margin-right:16px;cursor:pointer}
.num{width:28px;height:28px;border-radius:50%;background:#e3e3e3;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.num.done{background:#212121;color:#fff}
.ing{display:grid;grid-template-columns:1fr 100px 80px 32px;gap:8px;align-items:center}
.x{color:#8c8c8c;text-align:center;cursor:pointer;background:none;border:none}
.photo{height:130px;border-radius:6px;background:#e3e3e3;display:flex;align-items:center;justify-content:center}
.grid3{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.empty{padding:24px;text-align:center;color:#8c8c8c}
.role-tile{flex:1;text-align:center;padding:14px}
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<div id="app"></div>
<script>
const SCREENS = [
  ["login", "01 Login"],
  ["weekmenu", "02 Weekmenu"],
  ["bestellen", "03 Bestellen"],
  ["bestellingen", "04 Mijn bestellingen"],
  ["voorraad", "05 Voorraad"],
  ["recepten", "06 Recepten"],
  ["rit", "07 Mijn rit"],
];
const ALLERGENS = ["Gluten", "Lactose", "Noten", "Vis", "Ei", "Soja"];
const SLOTS = [["12:00 – 14:00", 5], ["17:00 – 19:00", 3], ["19:00 – 21:00", 0]];
const DAYS = ["ma 16 nov", "di 17 nov", "wo 18 nov", "do 19 nov"];

const S = {
  screen: "login",
  role: "Klant",
  week: "2026-W46",
  recipes: [
    { id: 1, name: "Risotto met paddenstoelen", time: 35, persons: 2, week: "2026-W46", allergens: ["Lactose"], desc: "Romige risotto met gebakken champignons en parmezaan.", ingredients: [["Arborio", 75, "g"], ["Champignons", 125, "g"], ["Parmezaan", 20, "g"], ["Groentebouillon", 250, "ml"]] },
    { id: 2, name: "Thaise groene curry", time: 30, persons: 2, week: "2026-W46", allergens: ["Noten"], desc: "Groene curry met kokosmelk en groenten.", ingredients: [["Kokosmelk", 200, "ml"], ["Jasmijnrijst", 75, "g"]] },
    { id: 3, name: "Pasta pesto met kerstomaat", time: 20, persons: 2, week: "2026-W46", allergens: ["Gluten", "Noten", "Lactose"], desc: "Snelle pasta met verse pesto.", ingredients: [["Penne", 100, "g"], ["Basilicum", 15, "g"], ["Kerstomaten", 100, "g"]] },
    { id: 4, name: "Zalm met geroosterde groenten", time: 25, persons: 2, week: "2026-W46", allergens: ["Vis"], desc: "Zalmfilet uit de oven met seizoensgroenten.", ingredients: [["Zalmfilet", 1, "stuk"]] },
    { id: 5, name: "Chili sin carne", time: 40, persons: 4, week: "2026-W47", allergens: [], desc: "Pittige vegetarische chili.", ingredients: [["Kidneybonen", 100, "g"]] },
    { id: 6, name: "Kip tikka masala", time: 35, persons: 2, week: "2026-W47", allergens: ["Lactose"], desc: "Indiase curry met yoghurt.", ingredients: [["Kipfilet", 150, "g"]] },
  ],
  box: new Set([1, 2]),
  persons: 2,
  day: 0,
  slot: 1,
  street: "Elfde-Liniestraat", nr: "24", zip: "3500", city: "Hasselt",
  orderError: false,
  orders: [
    { id: 1044, date: "10/11/2026", recipes: "Chili sin carne, Kip tikka masala", persons: 2, slot: "do 19/11 · 12–14 u", status: "PLACED" },
    { id: 1042, date: "09/11/2026", recipes: "Risotto, Thaise curry", persons: 4, slot: "ma 16/11 · 17–19 u", status: "CONFIRMED" },
    { id: 1038, date: "06/11/2026", recipes: "Zalm met groenten", persons: 2, slot: "di 10/11 · 17–19 u", status: "IN_DELIVERY" },
    { id: 1021, date: "28/10/2026", recipes: "Pasta pesto, Chili sin carne", persons: 2, slot: "ma 02/11 · 12–14 u", status: "DELIVERED" },
    { id: 1017, date: "27/10/2026", recipes: "Kip tikka masala", persons: 4, slot: "di 03/11 · 19–21 u", status: "CANCELLED" },
  ],
  cancelId: null,
  stock: [
    { name: "Arborio", unit: "g", qty: 1200, res: 800, min: 2000 },
    { name: "Kokosmelk", unit: "ml", qty: 1500, res: 400, min: 2000 },
    { name: "Zalmfilet", unit: "stuk", qty: 6, res: 4, min: 10 },
    { name: "Champignons", unit: "g", qty: 4800, res: 600, min: 1500 },
    { name: "Basilicum", unit: "g", qty: 900, res: 100, min: 300 },
    { name: "Kerstomaten", unit: "g", qty: 6000, res: 500, min: 2000 },
  ],
  stockSel: null,
  addQty: 5000,
  editId: 1,
  runStarted: false,
  stops: [
    { order: 1038, addr: "Elfde-Liniestraat 24, 3500 Hasselt", info: "1 recept · 2 pers.", done: false },
    { order: 1045, addr: "Kuringersteenweg 112, 3500 Hasselt", info: "3 recepten · 2 pers.", done: false },
    { order: 1047, addr: "Grote Markt 5, 3500 Hasselt", info: "2 recepten · 2 pers.", done: false },
    { order: 1050, addr: "Diestersteenweg 40, 3510 Kermt", info: "4 recepten · 4 pers.", done: false },
  ],
};

const fmt = n => n.toLocaleString("nl-BE");
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const low = s => s.qty < s.min;

function header(role, items) {
  return `<header class="header">
    <div class="left"><div class="logo">Maaltijdboxen</div>
      <nav class="nav">${items.map(([label, go]) => `<a data-go="${go}" class="${S.screen === go ? "active" : ""}">${label}</a>`).join("")}</nav></div>
    <div class="right"><span class="badge">Rol: ${role}</span><button class="btn small" data-go="login">Uitloggen</button></div>
  </header>`;
}
const klantNav = [["Weekmenu", "weekmenu"], ["Mijn bestellingen", "bestellingen"]];
const mwNav = [["Recepten", "recepten"], ["Voorraad", "voorraad"]];

const views = {
  login: () => `
  <div style="min-height:800px;display:flex;align-items:center;justify-content:center">
    <div class="panel" style="width:420px;padding:32px;gap:18px">
      <h1>Maaltijdboxen</h1>
      <span class="sub">Log in om verder te gaan</span>
      <div class="field"><label>Gebruikersnaam</label><input class="input" placeholder="bv. jan.peeters"></div>
      <div class="field"><label>Kies je rol</label>
        <div class="row" style="gap:12px">${["Klant", "Medewerker", "Chauffeur"].map(r => `<button class="tab role-tile ${S.role === r ? "active" : ""}" data-action="role" data-v="${r}">${r}</button>`).join("")}</div></div>
      <button class="btn primary block" data-action="login">Inloggen</button>
      <span class="muted">Geen echte login: de rol en gebruiker worden bijgehouden in de AuthService en meegestuurd als header (X-User-Role, X-User-Id).</span>
    </div>
  </div>`,

  weekmenu: () => {
    const list = S.recipes.filter(r => r.week === S.week);
    const inBox = S.recipes.filter(r => S.box.has(r.id));
    return `${header("KLANT", klantNav)}
    <main class="content">
      <div class="between"><h1>Weekmenu</h1><strong>Week 46 · 9–15 nov</strong></div>
      <div class="row">
        <div class="grid3">${list.map(r => `<div class="panel" style="padding:12px;gap:8px">
            <div class="photo muted">foto</div>
            <h2>${esc(r.name)}</h2><span class="sub">${r.time} min · ${r.persons} pers.</span><span class="muted">Allergenen: ${r.allergens.join(", ").toLowerCase() || "-"}</span>
            <button class="btn small block ${S.box.has(r.id) ? "primary" : ""}" data-action="toggle" data-id="${r.id}">${S.box.has(r.id) ? "In box ✓" : "Toevoegen aan box"}</button>
          </div>`).join("")}</div>
        <aside class="panel" style="width:300px">
          <h2>Mijn box</h2>
          ${inBox.length ? inBox.map(r => `<div class="between"><span>${esc(r.name)}</span><button class="x" data-action="toggle" data-id="${r.id}">✕</button></div>`).join("") : `<span class="muted">Je box is nog leeg.</span>`}
          <div class="divider"></div>
          <span class="muted">${inBox.length} recept${inBox.length === 1 ? "" : "en"}. Het aantal personen en het leverslot kies je in de volgende stap.</span>
          <button class="btn primary block" data-go="bestellen" ${inBox.length ? "" : "disabled"}>Verder naar bestellen</button>
        </aside>
      </div>
    </main>`;
  },

  bestellen: () => {
    const inBox = S.recipes.filter(r => S.box.has(r.id));
    const [slotT] = SLOTS[S.slot];
    return `${header("KLANT", klantNav)}
    <main class="content">
      <div class="between"><h1>Bestelling plaatsen</h1><button class="btn small" data-go="weekmenu">‹ Terug naar weekmenu</button></div>
      ${S.orderError ? `<div class="alert"><strong>Onvoldoende voorraad</strong>
        <span class="sub">Er is niet genoeg arborio voor ${S.persons} personen. Kies minder personen of verwijder de risotto uit je box.</span>
        <span class="muted">409 · INSUFFICIENT_STOCK</span></div>` : ""}
      <div class="row">
        <div class="stack" style="flex:1;gap:20px">
          <section class="panel"><h2>1. Jouw box</h2>
            ${inBox.length ? inBox.map(r => `<div class="between"><span>${esc(r.name)}</span><button class="x" data-action="toggle" data-id="${r.id}">✕</button></div>`).join("") : `<span class="muted">Je box is leeg.</span>`}
            <div class="divider"></div>
            <div class="between"><span class="sub">Aantal personen</span>
              <div class="stepper"><button data-action="persons" data-v="-1">−</button><span class="val">${S.persons}</span><button data-action="persons" data-v="1">+</button></div></div>
          </section>
          <section class="panel"><h2>2. Leveradres</h2>
            <div class="row" style="gap:12px">
              <div class="field" style="flex:3"><label>Straat</label><input class="input" data-bind="street" value="${esc(S.street)}"></div>
              <div class="field"><label>Nr.</label><input class="input" data-bind="nr" value="${esc(S.nr)}"></div></div>
            <div class="row" style="gap:12px">
              <div class="field"><label>Postcode</label><input class="input" data-bind="zip" value="${esc(S.zip)}"></div>
              <div class="field" style="flex:3"><label>Gemeente</label><input class="input" data-bind="city" value="${esc(S.city)}"></div></div>
          </section>
          <section class="panel"><h2>3. Leverslot</h2>
            <div class="tabs">${DAYS.map((d, i) => `<button class="tab ${S.day === i ? "active" : ""}" data-action="day" data-v="${i}">${d}</button>`).join("")}</div>
            <div class="slots">${SLOTS.map(([t, free], i) => free === 0
              ? `<div class="slot full"><strong>${t}</strong><span>Volzet</span></div>`
              : `<button class="slot ${S.slot === i ? "active" : ""}" data-action="slot" data-v="${i}"><strong>${t}</strong><span class="sub">${free} plaatsen vrij</span></button>`).join("")}</div>
          </section>
        </div>
        <aside class="panel" style="width:320px">
          <h2>Overzicht</h2>
          <div class="between"><span class="sub">Recepten</span><span>${inBox.length}</span></div>
          <div class="between"><span class="sub">Personen</span><span>${S.persons}</span></div>
          <div class="between"><span class="sub">Leverslot</span><span>${DAYS[S.day]} · ${slotT}</span></div>
          <div class="between"><span class="sub">Adres</span><span style="text-align:right">${esc(S.street)} ${esc(S.nr)}, ${esc(S.city)}</span></div>
          <div class="divider"></div>
          <button class="btn primary block" data-action="place" ${inBox.length ? "" : "disabled"}>Bestelling plaatsen</button>
          <span class="muted">Voorraad en leverslot worden meteen gecontroleerd. Lukt het niet, dan zie je dat hier bovenaan.</span>
          <span class="muted">Prototype: kies 6 of meer personen met de risotto in je box om de 409-fout te zien.</span>
        </aside>
      </div>
    </main>`;
  },

  bestellingen: () => {
    const open = o => o.status === "PLACED" || o.status === "CONFIRMED";
    const rows = S.orders;
    const cancel = S.orders.find(o => o.id === S.cancelId);
    const badgeCls = s => s === "IN_DELIVERY" ? "dark" : s === "CANCELLED" ? "outline" : "";
    return `${header("KLANT", klantNav)}
    <main class="content">
      <h1>Mijn bestellingen</h1>
      <table><thead><tr><th>Bestelling</th><th>Geplaatst op</th><th>Recepten</th><th>Pers.</th><th>Leverslot</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows.map(o => `<tr class="${o.id === S.cancelId ? "selected" : ""}"><td><strong>#${o.id}</strong></td><td>${o.date}</td><td>${esc(o.recipes)}</td><td>${o.persons}</td><td>${o.slot}</td>
          <td><span class="badge ${badgeCls(o.status)}">${o.status}</span></td>
          <td><button class="btn small" data-action="askCancel" data-id="${o.id}" ${open(o) ? "" : "disabled"}>Annuleren</button></td></tr>`).join("")}</tbody></table>
      ${cancel ? `<div class="alert soft" style="max-width:520px">
        <strong>Bestelling #${cancel.id} annuleren?</strong>
        <span class="sub">Je gereserveerde ingrediënten en je plaats in het leverslot worden vrijgegeven.</span>
        <div class="row" style="gap:8px;margin-top:8px"><button class="btn small" data-action="cancelNo">Nee</button><button class="btn small primary" data-action="cancelYes">Ja, annuleren</button></div>
      </div>` : ""}
      <span class="muted">Annuleren kan zolang de status PLACED of CONFIRMED is. Daarna is de knop uitgeschakeld (409).</span>
    </main>`;
  },

  voorraad: () => {
    const lows = S.stock.filter(low);
    const rows = S.stock;
    const sel = S.stock.find(s => s.name === S.stockSel);
    return `${header("MEDEWERKER", mwNav)}
    <main class="content">
      <h1>Voorraad</h1>
      ${lows.length ? `<div class="alert"><strong>${lows.length} ingrediënt${lows.length === 1 ? "" : "en"} ${lows.length === 1 ? "raakt" : "raken"} op</strong><span class="sub">${lows.map(s => s.name).join(", ")} ${lows.length === 1 ? "zit" : "zitten"} onder het minimum.</span></div>` : `<div class="alert soft"><strong>Alles op voorraad</strong><span class="sub">Geen enkel ingrediënt zit onder het minimum.</span></div>`}
      <div class="row">
        <table style="flex:1"><thead><tr><th>Ingrediënt</th><th>Eenheid</th><th>In stock</th><th>Gereserveerd</th><th>Minimum</th><th>Status</th><th></th></tr></thead>
          <tbody>${rows.map(s => `<tr class="${s.name === S.stockSel ? "selected" : ""}"><td><strong>${s.name}</strong></td><td>${s.unit}</td><td>${fmt(s.qty)}</td><td>${fmt(s.res)}</td><td>${fmt(s.min)}</td>
            <td><span class="badge ${low(s) ? "dark" : ""}">${low(s) ? "Raakt op" : "OK"}</span></td><td><button class="btn small" data-action="stockSel" data-v="${s.name}">Aanvullen</button></td></tr>`).join("")}</tbody></table>
        <aside class="panel" style="width:300px">
          <h2>Voorraad aanvullen</h2>
          ${sel ? `
          <div class="between"><span class="sub">Ingrediënt</span><strong>${sel.name}</strong></div>
          <div class="between"><span class="sub">Huidige stock</span><span>${fmt(sel.qty)} ${sel.unit}</span></div>
          <div class="field"><label>Hoeveelheid toevoegen (${sel.unit})</label><input class="input" type="number" min="1" data-bind="addQty" value="${S.addQty}"></div>
          <div class="between"><span class="sub">Nieuwe stock</span><strong id="newStock">${fmt(sel.qty + Number(S.addQty || 0))} ${sel.unit}</strong></div>
          <div class="row" style="gap:8px"><button class="btn" style="flex:1" data-action="stockCancel">Annuleren</button><button class="btn primary" style="flex:1" data-action="stockSave">Opslaan</button></div>`
          : `<span class="muted">Kies "Aanvullen" bij een ingrediënt.</span>`}
        </aside>
      </div>
    </main>`;
  },

  recepten: () => {
    const list = S.recipes;
    const r = S.recipes.find(x => x.id === S.editId) || { id: null, name: "", time: "", persons: 2, week: "2026-W46", allergens: [], desc: "", ingredients: [["", "", "g"]] };
    return `${header("MEDEWERKER", mwNav)}
    <main class="content">
      <div class="between"><h1>Recepten</h1><button class="btn primary" data-action="newRecipe">+ Nieuw recept</button></div>
      <div class="row">
        <div class="stack" style="flex:1">
          <table><thead><tr><th>Naam</th><th>Week</th><th>Bereiding</th><th></th></tr></thead>
            <tbody>${list.map(x => `<tr class="${x.id === S.editId ? "selected" : ""}"><td><strong>${esc(x.name)}</strong></td><td>${x.week}</td><td>${x.time} min</td><td><button class="btn small" data-action="edit" data-id="${x.id}">Bewerken</button></td></tr>`).join("")}</tbody></table>
        </div>
        <aside class="panel" style="width:520px" id="recipeForm">
          <h2>${r.id ? "Recept bewerken" : "Nieuw recept"}</h2>
          <div class="field"><label>Naam</label><input class="input" name="name" value="${esc(r.name)}" placeholder="bv. Lasagne">${S.recipeError ? `<span class="sub" style="color:#212121;font-weight:500">Naam is verplicht (400).</span>` : ""}</div>
          <div class="field"><label>Beschrijving</label><textarea class="input" name="desc">${esc(r.desc)}</textarea></div>
          <div class="row" style="gap:12px">
            <div class="field"><label>Bereidingstijd (min)</label><input class="input" name="time" type="number" value="${r.time}"></div>
            <div class="field"><label>Aantal personen</label><input class="input" name="persons" type="number" value="${r.persons}"></div>
            <div class="field"><label>Week</label><input class="input" name="week" value="${r.week}"></div></div>
          <div class="field"><label>Allergenen</label>
            <div>${ALLERGENS.map(a => `<label class="check"><input type="checkbox" name="allergen" value="${a}" ${r.allergens.includes(a) ? "checked" : ""}>${a}</label>`).join("")}</div></div>
          <div class="field"><label>Ingrediënten (hoeveelheid per persoon)</label>
            <div class="stack" style="gap:8px" id="ingRows">${r.ingredients.map(i => ingRow(i)).join("")}</div>
            <button class="btn small" style="width:max-content;margin-top:4px" data-action="addIng">+ Ingrediënt toevoegen</button></div>
          <div class="divider"></div>
          <div class="row" style="gap:8px;justify-content:flex-end"><button class="btn" data-action="edit" data-id="${list[0] ? list[0].id : ""}">Annuleren</button><button class="btn primary" data-action="saveRecipe">Opslaan</button></div>
        </aside>
      </div>
    </main>`;
  },

  rit: () => {
    const done = S.stops.filter(s => s.done).length;
    const all = done === S.stops.length;
    const status = !S.runStarted ? "GEPLAND" : all ? "AFGEROND" : "IN_DELIVERY";
    return `<header class="header"><div class="logo">Maaltijdboxen</div><div class="right"><span class="badge">Rol: CHAUFFEUR</span><button class="btn small" data-go="login">↩</button></div></header>
    <main class="content">
      <div class="stack" style="gap:6px"><h1>Mijn rit</h1><span class="sub">ma 16 nov · 17:00 – 19:00</span></div>
      <div class="panel">
        <div class="between"><span class="badge ${S.runStarted ? "dark" : ""}">${status}</span><span class="sub">${done} van ${S.stops.length} geleverd</span></div>
        ${S.runStarted ? `<span class="muted">Elke levering stuurt delivery.completed, zodat de klant de status DELIVERED ziet.</span>` : `<button class="btn primary block" data-action="startRun">Rit starten</button><span class="muted">"Rit starten" zet alle bestellingen op IN_DELIVERY.</span>`}
      </div>
      <div class="stack">${S.stops.map((s, i) => `<div class="panel" style="gap:10px">
          <div class="row" style="gap:12px;align-items:center"><div class="num ${s.done ? "done" : ""}">${i + 1}</div><strong>Bestelling #${s.order}</strong></div>
          <span>${s.addr}</span><span class="sub">${s.info}</span>
          ${s.done ? `<span class="badge" style="width:max-content">Geleverd ✓</span>` : `<button class="btn block ${S.runStarted ? "primary" : ""}" data-action="deliver" data-v="${i}" ${S.runStarted ? "" : "disabled"}>Markeer als geleverd</button>`}
        </div>`).join("")}</div>
    </main>`;
  },
};

function ingRow(i) {
  return `<div class="ing"><input class="input" name="ingName" value="${esc(i[0])}" placeholder="Ingrediënt"><input class="input" name="ingQty" type="number" value="${i[1]}"><input class="input" name="ingUnit" value="${esc(i[2])}"><button class="x" data-action="delIng">✕</button></div>`;
}

function go(screen) {
  S.screen = screen; S.recipeError = false;
  if (location.hash !== "#" + screen) history.replaceState(null, "", "#" + screen);
  render(); window.scrollTo(0, 0);
}

function render() {
  document.getElementById("toolbar").innerHTML = `<strong>Prototype</strong>` + SCREENS.map(([id, label]) => `<a data-go="${id}" class="${S.screen === id ? "on" : ""}">${label}</a>`).join("");
  const mobile = S.screen === "rit";
  document.getElementById("app").innerHTML = `<div class="frame ${mobile ? "mobile-frame" : ""}"><div class="screen">${views[S.screen]()}</div></div>`;
}

function readRecipeForm() {
  const f = document.getElementById("recipeForm");
  const val = n => f.querySelector(`[name="${n}"]`).value.trim();
  const names = [...f.querySelectorAll('[name="ingName"]')].map(e => e.value.trim());
  const qtys = [...f.querySelectorAll('[name="ingQty"]')].map(e => Number(e.value));
  const units = [...f.querySelectorAll('[name="ingUnit"]')].map(e => e.value.trim());
  return {
    name: val("name"), desc: val("desc"), time: Number(val("time")) || 0, persons: Number(val("persons")) || 1, week: val("week") || "2026-W46",
    allergens: [...f.querySelectorAll('[name="allergen"]:checked')].map(e => e.value),
    ingredients: names.map((n, i) => [n, qtys[i], units[i]]).filter(i => i[0]),
  };
}

const actions = {
  role: v => { S.role = v; render(); },
  login: () => go({ Klant: "weekmenu", Medewerker: "voorraad", Chauffeur: "rit" }[S.role]),
  toggle: (v, id) => { S.box.has(id) ? S.box.delete(id) : S.box.add(id); S.orderError = false; render(); },
  persons: v => { S.persons = Math.max(1, Math.min(8, S.persons + Number(v))); S.orderError = false; render(); },
  day: v => { S.day = Number(v); render(); },
  slot: v => { S.slot = Number(v); render(); },
  place: () => {
    if (S.persons >= 6 && S.box.has(1)) { S.orderError = true; render(); window.scrollTo(0, 0); return; }
    const id = Math.max(1059, ...S.orders.map(o => o.id)) + 1;
    const names = S.recipes.filter(r => S.box.has(r.id)).map(r => r.name.split(" ")[0]).join(", ");
    S.orders.unshift({ id, date: "10/11/2026", recipes: names, persons: S.persons, slot: `${DAYS[S.day].slice(0, 9)} · ${SLOTS[S.slot][0].replace(":00", "").replace(":00", "")} u`, status: "CONFIRMED" });
    S.box.clear(); S.orderError = false;
    go("bestellingen");
  },
  askCancel: (v, id) => { S.cancelId = id; render(); },
  cancelNo: () => { S.cancelId = null; render(); },
  cancelYes: () => { const o = S.orders.find(o => o.id === S.cancelId); o.status = "CANCELLED"; S.cancelId = null; render(); },
  stockSel: v => { S.stockSel = v; S.addQty = 5000; render(); },
  stockCancel: () => { S.stockSel = null; render(); },
  stockSave: () => { const s = S.stock.find(s => s.name === S.stockSel); const n = Number(S.addQty); if (!(n > 0)) return; s.qty += n; S.stockSel = null; render(); },
  edit: (v, id) => { S.editId = id || null; S.recipeError = false; render(); },
  newRecipe: () => { S.editId = null; S.recipeError = false; render(); },
  addIng: () => document.getElementById("ingRows").insertAdjacentHTML("beforeend", ingRow(["", "", "g"])),
  delIng: (v, id, el) => el.closest(".ing").remove(),
  saveRecipe: () => {
    const d = readRecipeForm();
    if (!d.name) { S.recipeError = true; render(); return; }
    if (S.editId) Object.assign(S.recipes.find(r => r.id === S.editId), d);
    else { const id = Math.max(...S.recipes.map(r => r.id)) + 1; S.recipes.push({ id, ...d }); S.editId = id; }
    S.recipeError = false; render();
  },
  startRun: () => { S.runStarted = true; S.orders.forEach(o => { if (S.stops.some(s => s.order === o.id)) o.status = "IN_DELIVERY"; }); render(); },
  deliver: v => { const s = S.stops[Number(v)]; s.done = true; const o = S.orders.find(o => o.id === s.order); if (o) o.status = "DELIVERED"; render(); },
};

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest("[data-action]");
  if (a && !a.disabled && actions[a.dataset.action]) { e.preventDefault(); actions[a.dataset.action](a.dataset.v, a.dataset.id ? Number(a.dataset.id) : null, a); }
});
document.addEventListener("input", e => {
  const b = e.target.dataset.bind;
  if (!b) return;
  S[b] = e.target.value;
  if (b === "addQty") { const s = S.stock.find(s => s.name === S.stockSel); const el = document.getElementById("newStock"); if (s && el) el.textContent = `${fmt(s.qty + Number(S.addQty || 0))} ${s.unit}`; }
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (views[h] && h !== S.screen) go(h); });

const start = location.hash.slice(1);
go(views[start] ? start : "login");
</script>
</body>
</html>
