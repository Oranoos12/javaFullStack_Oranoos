@if (auth.user(); as user) {
  <header class="header">
    <div class="header-left">
      <a routerLink="/" class="logo">Maaltijdboxen</a>
      <nav aria-label="Hoofdmenu" class="nav">
        <a routerLink="/weekmenu" routerLinkActive="active">Weekmenu</a>
        <a routerLink="/bestellen" routerLinkActive="active">Bestellen</a>
        <a routerLink="/bestellingen" routerLinkActive="active">Mijn bestellingen</a>
      </nav>
    </div>
    <div class="header-right">
      <span class="badge">{{ user.id }} · {{ user.role }}</span>
      <button type="button" class="btn small" (click)="logout()">Uitloggen</button>
    </div>
  </header>
}
<main class="content">
  <router-outlet />
</main>
