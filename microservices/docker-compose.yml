services:

  department-db:
    image: mysql:8
    container_name: department-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: department
    ports:
      - "3306:3306"

  organization-db:
    image: mysql:8
    container_name: organization-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: organization
    ports:
      - "3307:3306"

  employee-db:
    image: mysql:8
    container_name: employee-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee
    ports:
      - "3308:3306"

  notification-db:
    image: mysql:8
    container_name: notification-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notification
    ports:
      - "3309:3306"

  loki:
    image: grafana/loki:3.7.7
    container_name: loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro